<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Chat + Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<!-- Socket.io client -->
<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#f0a030;--gold-bright:#ffd060;--gold-dark:#c87820;
  --bg:#080503;--bg2:#0f0a04;--bg3:#1a0f06;
  --border:#3d1f08;--text:#f0e0c0;--dim:#8b6030;
}
body{background:var(--bg3);font-family:'IM Fell English',serif;color:var(--text);padding:16px;display:grid;grid-template-columns:1fr 320px;gap:16px;min-height:100vh;}

/* ===== LIVE CHAT BOARD ===== */
.board-section{display:flex;flex-direction:column;gap:12px;}
.board-outer{
  position:relative;background:var(--bg);border-radius:3px;
  flex:1;min-height:260px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--border);
}
.board-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.board-inner{position:relative;z-index:2;text-align:center;padding:36px 50px;width:100%;}
.board-title-text{font-family:'Cinzel',serif;font-size:20px;letter-spacing:6px;color:#fff;text-shadow:0 0 12px rgba(255,255,255,0.5);}
.board-msg-wrap{animation:appear 0.5s ease;}
@keyframes appear{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.board-msg{font-family:'IM Fell English',serif;font-size:18px;color:#fff;text-shadow:0 0 10px rgba(255,255,255,0.6);margin-bottom:10px;line-height:1.5;}
.board-attr{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);font-style:italic;font-size:13px;}
.board-attr::before,.board-attr::after{content:'';display:block;width:30px;height:1px;background:var(--gold);opacity:0.5;}
.board-amount{font-family:'Cinzel',serif;font-size:13px;color:var(--gold-dark);margin-top:8px;letter-spacing:2px;}

/* status dot */
.status-bar{display:flex;align-items:center;gap:8px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;color:var(--dim);}
.status-dot{width:7px;height:7px;border-radius:50%;background:#444;}
.status-dot.connected{background:#22c55e;box-shadow:0 0 6px #22c55e;}
.status-dot.disconnected{background:#ef4444;}

/* ===== LEADERBOARD ===== */
.leaderboard{background:var(--bg2);border:1.5px solid var(--border);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;height:fit-content;}
.lb-header{display:flex;align-items:center;justify-content:space-between;}
.lb-title{font-family:'Cinzel',serif;font-size:13px;letter-spacing:3px;color:var(--gold-bright);}
.lb-subtitle{font-size:11px;color:var(--dim);font-style:italic;}

.lb-list{display:flex;flex-direction:column;gap:6px;}
.lb-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;background:var(--bg);border:1px solid var(--border);
  border-radius:5px;animation:fadeIn 0.4s ease;transition:border-color 0.3s;
}
.lb-item.rank-1{border-color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,0.15);}
.lb-item.rank-2{border-color:#c0c0c0;box-shadow:0 0 6px rgba(192,192,192,0.1);}
.lb-item.rank-3{border-color:#cd7f32;box-shadow:0 0 6px rgba(205,127,50,0.1);}
@keyframes fadeIn{from{opacity:0;transform:translateX(6px);}to{opacity:1;transform:translateX(0);}}

.lb-rank{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:12px;font-weight:900;
  background:var(--bg2);color:var(--dim);border:1px solid var(--border);
}
.lb-item.rank-1 .lb-rank{background:#3a2a00;color:#ffd700;border-color:#ffd700;}
.lb-item.rank-2 .lb-rank{background:#1a1a1a;color:#c0c0c0;border-color:#c0c0c0;}
.lb-item.rank-3 .lb-rank{background:#2a1500;color:#cd7f32;border-color:#cd7f32;}

.lb-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold-dark),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:12px;font-weight:700;color:#fff;
}
.lb-info{flex:1;min-width:0;}
.lb-name{font-family:'Cinzel',serif;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-count{font-size:10px;color:var(--dim);margin-top:1px;}
.lb-total{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);white-space:nowrap;}

.lb-empty{text-align:center;padding:24px;color:var(--dim);font-style:italic;font-size:13px;}

/* divider -->*/
.divider{height:1px;background:var(--border);margin:4px 0;}

/* alert overlay */
.alert-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.87);
  display:none;align-items:center;justify-content:center;z-index:100;
}
.alert-overlay.show{display:flex;}
.alert-box{width:440px;background:var(--bg);position:relative;animation:alertIn 0.5s cubic-bezier(0.175,0.885,0.32,1.275);}
@keyframes alertIn{from{opacity:0;transform:scale(0.82);}to{opacity:1;transform:scale(1);}}
.alert-svg-wrap{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
.alert-content{position:relative;z-index:2;padding:30px 40px;text-align:center;}
.alert-badge{display:inline-flex;align-items:center;gap:7px;background:#1a0800;border:1px solid var(--gold);border-radius:3px;padding:4px 12px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:3px;color:var(--gold);margin-bottom:14px;}
.alert-dot{width:5px;height:5px;background:var(--gold);border-radius:50%;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.alert-avatar{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,var(--gold-dark),var(--gold-bright));display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:24px;font-weight:900;color:#fff;border:3px solid var(--gold-bright);box-shadow:0 0 22px rgba(255,208,96,0.5);}
.alert-name{font-family:'Cinzel',serif;font-size:20px;letter-spacing:2px;color:var(--gold-bright);text-shadow:0 0 10px rgba(255,208,96,0.4);}
.alert-amount{font-family:'Cinzel',serif;font-size:26px;color:var(--gold);text-shadow:0 0 14px rgba(240,160,48,0.5);margin:8px 0;}
.alert-msg{font-size:14px;color:var(--text);font-style:italic;border-top:1px solid var(--border);padding-top:10px;margin-top:4px;line-height:1.6;}
.alert-close{margin-top:14px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--dim);font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;padding:7px 18px;cursor:pointer;transition:all 0.15s;}
.alert-close:hover{border-color:var(--gold);color:var(--gold);}

/* ===== TEST PANEL ===== */
.test-panel{
  position:fixed;bottom:16px;right:16px;z-index:1000;
  background:#0f0a04;border:1.5px solid #c87820;border-radius:8px;
  padding:14px 16px;min-width:280px;
  box-shadow:0 4px 24px rgba(0,0,0,0.7);
  font-family:'Cinzel',serif;
}
.test-panel-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.test-panel-title{font-size:11px;letter-spacing:2px;color:#ffd060;}
.test-toggle-btn{
  background:none;border:none;color:#8b6030;cursor:pointer;
  font-size:16px;line-height:1;padding:0 2px;
}
.test-panel-body{display:flex;flex-direction:column;gap:7px;}
.test-input{
  background:#1a0f06;border:1px solid #3d1f08;border-radius:4px;
  color:#f0e0c0;font-family:'IM Fell English',serif;font-size:13px;
  padding:6px 10px;width:100%;outline:none;
  transition:border-color 0.2s;
}
.test-input:focus{border-color:#c87820;}
.test-input::placeholder{color:#5a3a18;}
.test-btn-row{display:flex;gap:8px;margin-top:4px;}
.test-btn{
  flex:1;padding:7px 10px;border:none;border-radius:4px;
  font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;
  cursor:pointer;transition:all 0.2s;font-weight:700;
}
.test-btn-send{background:#c87820;color:#fff;}
.test-btn-send:hover{background:#ffd060;color:#1a0800;}
.test-btn-clear{background:#3d1f08;color:#c87820;border:1px solid #c87820;}
.test-btn-clear:hover{background:#6b0000;color:#fff;border-color:#ff4444;}
.test-status{font-size:10px;color:#5a3a18;text-align:center;font-style:italic;min-height:14px;}
.test-panel-collapsed .test-panel-body,.test-panel-collapsed .test-status{display:none;}
</style>
</head>

<script>
// =============================================
// GANTI URL INI dengan URL server kamu!
// Contoh: 'https://saweria-server.railway.app'
// =============================================
const SERVER_URL = window.location.origin;

const socket = io(SERVER_URL);
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

socket.on('connect', () => {
  statusDot.className = 'status-dot connected';
  statusText.textContent = 'TERHUBUNG';
});
socket.on('disconnect', () => {
  statusDot.className = 'status-dot disconnected';
  statusText.textContent = 'TERPUTUS';
});

// Terima donasi baru
socket.on('new_donation', (d) => {
  updateBoard(d);
  showAlert(d);
});

// Terima update leaderboard
socket.on('leaderboard_update', (lb) => {
  renderLeaderboard(lb);
});

function formatRp(n) { return 'Rp' + parseInt(n).toLocaleString('id-ID'); }
function getInitials(n) { return n.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?'; }

function updateBoard(d) {
  const board = document.getElementById('board-content');
  board.innerHTML = `
    <div class="board-msg-wrap">
      <div class="board-msg">"${d.message}"</div>
      <div class="board-attr">— ${d.name} (@${d.name.toLowerCase().replace(/\s/g,'')})</div>
      <div class="board-amount">${formatRp(d.amount)}</div>
    </div>`;
}

function renderLeaderboard(lb) {
  const list = document.getElementById('lb-list');
  document.getElementById('lb-empty').style.display = lb.length ? 'none' : 'block';
  list.querySelectorAll('.lb-item').forEach(el => el.remove());

  lb.forEach((item, i) => {
    const rank = i + 1;
    const el = document.createElement('div');
    el.className = `lb-item${rank<=3?' rank-'+rank:''}`;
    const medals = ['🥇','🥈','🥉'];
    el.innerHTML = `
      <div class="lb-rank">${rank <= 3 ? medals[rank-1] : rank}</div>
      <div class="lb-avatar">${getInitials(item.name)}</div>
      <div class="lb-info">
        <div class="lb-name">${item.name}</div>
        <div class="lb-count">${item.count}x donasi</div>
      </div>
      <div class="lb-total">${formatRp(item.total)}</div>`;
    list.appendChild(el);
  });
}

function showAlert(d) {
  document.getElementById('a-avatar').textContent = getInitials(d.name);
  document.getElementById('a-name').textContent = d.name;
  document.getElementById('a-amount').textContent = formatRp(d.amount);
  document.getElementById('a-msg').textContent = '"' + d.message + '"';
  document.getElementById('alert-overlay').classList.add('show');
}

function closeAlert() {
  document.getElementById('alert-overlay').classList.remove('show');
}
</script>

<!-- TEST PANEL -->
<div class="test-panel" id="test-panel">
  <div class="test-panel-header">
    <span class="test-panel-title">⚗ TEST DONASI</span>
    <button class="test-toggle-btn" onclick="toggleTestPanel()" title="Collapse">▼</button>
  </div>
  <div class="test-panel-body">
    <input class="test-input" id="t-name" type="text" placeholder="Nama donatur" value="TestUser">
    <input class="test-input" id="t-amount" type="number" placeholder="Nominal (Rp)" value="10000">
    <input class="test-input" id="t-msg" type="text" placeholder="Pesan" value="Test donasi!">
    <div class="test-btn-row">
      <button class="test-btn test-btn-send" onclick="sendTestDonation()">▶ KIRIM</button>
      <button class="test-btn test-btn-clear" onclick="clearAllData()">🗑 HAPUS</button>
    </div>
  </div>
  <div class="test-status" id="test-status"></div>
</div>

<script>
// ===== TEST PANEL =====
let testPanelOpen = true;

function toggleTestPanel() {
  testPanelOpen = !testPanelOpen;
  const panel = document.getElementById('test-panel');
  const btn = panel.querySelector('.test-toggle-btn');
  if (testPanelOpen) {
    panel.classList.remove('test-panel-collapsed');
    btn.textContent = '▼';
  } else {
    panel.classList.add('test-panel-collapsed');
    btn.textContent = '▲';
  }
}

function setStatus(msg, isError) {
  const el = document.getElementById('test-status');
  el.textContent = msg;
  el.style.color = isError ? '#ef4444' : '#22c55e';
  setTimeout(() => { el.textContent = ''; el.style.color = '#5a3a18'; }, 3000);
}

async function sendTestDonation() {
  const name   = document.getElementById('t-name').value.trim() || 'TestUser';
  const amount = parseInt(document.getElementById('t-amount').value) || 10000;
  const msg    = document.getElementById('t-msg').value.trim() || 'Test donasi!';

  try {
    const res = await fetch('/api/test-donation', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, amount, message: msg})
    });
    if (res.ok) {
      setStatus('✓ Donasi terkirim!');
    } else {
      setStatus('✗ Gagal kirim', true);
    }
  } catch(e) {
    setStatus('✗ Error: ' + e.message, true);
  }
}

async function clearAllData() {
  if (!confirm('Hapus semua data donasi dan leaderboard?')) return;
  try {
    const res = await fetch('/api/clear', { method: 'POST' });
    if (res.ok) {
      setStatus('✓ Data dihapus!');
      renderLeaderboard([]);
      document.getElementById('board-content').innerHTML = '';
    } else {
      setStatus('✗ Gagal hapus', true);
    }
  } catch(e) {
    setStatus('✗ Error: ' + e.message, true);
  }
}
</script>
